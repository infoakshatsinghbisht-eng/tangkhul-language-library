[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tangkhul-language-library"
version = "0.1.0"
description = "A modular Python library for Tangkhul language preservation, linguistic research, vocabulary extraction, and cultural documentation."
readme = "README.md"
requires-python = ">=3.10"
# License and author details are subject to community confirmation.
# Generic project attribution is specified without inventing personal identities or arbitrary licenses.
authors = [
    { name = "Tangkhul Language Preservation Project Contributors" }
]
keywords = [
    "tangkhul",
    "tibeto-burman",
    "tangkhulic",
    "linguistics",
    "language-preservation",
    "dictionary",
    "folklore",
    "nlp"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]
pdf = [
    "pypdf>=4.0"
]

[project.scripts]
tangkhul = "tangkhul_lib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tangkhul_lib = ["py.typed", "data/*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP"   # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501"]
"src/tangkhul_lib/books/builder.py" = ["E501"]
"src/tangkhul_lib/books/new_books_data.py" = ["E501"]
"src/tangkhul_lib/books/new_books_data_batch2.py" = ["E501"]


[tool.ruff.lint.isort]
known-first-party = ["tangkhul_lib"]
